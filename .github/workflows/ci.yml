name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      s3mock:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
    env:
      PIER_TEST_S3_ENDPOINT: http://127.0.0.1:9090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for S3Mock
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9090/favicon.ico && exit 0
            sleep 1
          done
          echo "S3Mock did not come up" >&2
          exit 1
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags integration ./test/integration

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          tag=${GITHUB_REF_NAME}
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=${arch} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${tag}" \
                -o dist/pier ./cmd/pier
            tar -czf "dist/pier_${tag}_linux_${arch}.tar.gz" -C dist pier
            rm dist/pier
          done
          (cd dist && sha256sum *.tar.gz > sha256sums)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          platforms: linux/amd64,linux/arm64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/brutasse/pier:${{ github.ref_name }}
            ghcr.io/brutasse/pier:latest
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/pier_${{ github.ref_name }}_linux_amd64.tar.gz
            dist/pier_${{ github.ref_name }}_linux_arm64.tar.gz
            dist/sha256sums

  update-install-docs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-branch
      - name: Point install command at this release
        working-directory: main-branch
        run: |
          tag=${GITHUB_REF_NAME}
          sed -i -E \
            -e "s#brutasse/pier/(main|v[^/ ]+)/install\.sh#brutasse/pier/${tag}/install.sh#g" \
            -e "s#pier:v[^ :]+#pier:${tag}#g" \
            README.md docs/quickstart.md
          if git diff --quiet; then
            echo "docs already point at ${tag}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/quickstart.md
          git commit -m "docs: install command for ${tag}"
          git push origin HEAD:main
