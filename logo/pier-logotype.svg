<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95.5 52">
  <!-- pier logotype (light background): geometric monoline lowercase,
       5-unit round-cap strokes on a grid (x-height 20, baseline y=52,
       6-unit ink gaps). The "i" is entirely the buoy: amber ring as the
       dot, full-height striped capsule (favicon pattern: navy/amber/
       navy/amber) as the stem. e's aperture opens 70 deg so the round
       caps leave a real gap. -->
  <g transform="translate(3.5 -16)" fill="none" stroke="#123047"
     stroke-width="5" stroke-linecap="round">
    <!-- p -->
    <path d="M7 34.5V57.5"/>
    <circle cx="14.5" cy="42" r="7.5"/>
    <!-- e: crossbar + open bowl, aperture at 4-5 o'clock -->
    <path d="M63 42H48"/>
    <path d="M63 42A7.5 7.5 0 1 0 58.07 49.05"/>
    <!-- r -->
    <path d="M74 34.5V49.5"/>
    <path d="M81.5 34.5A7.5 7.5 0 0 0 74 42"/>
  </g>
  <!-- buoy i: ring (dot) + striped capsule (stem), baseline-aligned -->
  <g transform="translate(3.5 -16)">
    <defs>
      <clipPath id="istrip">
        <rect x="30.5" y="32" width="9" height="20" rx="4.5"/>
      </clipPath>
    </defs>
    <circle cx="35" cy="27.75" r="2.5" fill="none"
            stroke="#E9A13B" stroke-width="2.5"/>
    <rect x="30.5" y="32" width="9" height="20" rx="4.5" fill="#123047"/>
    <g clip-path="url(#istrip)">
      <rect x="30.5" y="37" width="9" height="5" fill="#E9A13B"/>
      <rect x="30.5" y="47" width="9" height="5" fill="#E9A13B"/>
    </g>
  </g>
</svg>
